<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="shortcut icon" href="images/Powder.svg" type="image/x-icon">

        <link rel="stylesheet" href="scripts/style.css">
        <script type="module" src="scripts/rom.js"></script>
        <script type="module" src="scripts/global.d.js"></script>

        <title>Matter Box</title>
    </head>
    <body>
        <div class="Hud">
            <div class="SimulationStats">
                <div class="Framerate">Framerate: 0, 100%</div>
                <div class="Particles">Parts: 0</div>
                <div class="Timescale">Timescale: 1x</div>
            </div>
        </div>
        <div class="Elements">
            <div class="TypeList"></div>
            <div class="Selector">
                <div class="Liquid"></div><div class="Explosive"></div>
                <div class="Solid"></div><div class="Powder"></div>
                <div class="Gas"></div><div class="Radioactive"></div>
                <div class="None"></div>
            </div>
        </div>
        <canvas class="Canvas"></canvas>
        <div class="Cursor"></div>
        <div style="opacity: 0;" class="PartStats"><div class="Name">NONE</div>,<div class="Color"></div>,<div class="Temp">0⁰C</div>,<div class="Tmp">0</div></div>
    </body>
</html>
